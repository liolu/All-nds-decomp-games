# Per-game build settings read by tools/configure.py (shared by every game). Delete a key to get the default.
game = "castlevania_portrait_of_ruin"
mwcc_version = "2.0/sp1p5"   # default compiler; single files can differ in config/<version>/compilers.txt
opt = "-O4,p"
lang = "c"                   # "c++" for C++ games
extra_cc_flags = []
dsd = "dsi-enhanced"         # set up with the patched dsd (DSi-enhanced / SDK5 ROMs), not published yet
